<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2E1E" />
      <stop offset="40%" stop-color="#2D472D" />
      <stop offset="70%" stop-color="#4E3B2B" />
      <stop offset="100%" stop-color="#261A13" />
    </linearGradient>
    <radialGradient id="sunGlow_2" cx="35%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFF8E1" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FFD54F" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#FF7043" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sareePink_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1493" />
      <stop offset="30%" stop-color="#E91E63" />
      <stop offset="65%" stop-color="#C2185B" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>
    <linearGradient id="goldZari_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="35%" stop-color="#FDD835" />
      <stop offset="70%" stop-color="#C69214" />
      <stop offset="100%" stop-color="#8C6207" />
    </linearGradient>
    <pattern id="zariPattern_2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M10 0 L20 10 L10 20 L0 10 Z" fill="none" stroke="#FDD835" stroke-width="1.2" stroke-opacity="0.65" />
      <circle cx="10" cy="10" r="2.5" fill="#FFF9C4" fill-opacity="0.8" />
    </pattern>
    <filter id="goldGlow_2">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="1000" fill="url(#bgGrad_2)" />
  <rect width="800" height="1000" fill="url(#sunGlow_2)" />

  <!-- Background Architecture -->
  
        <g opacity="0.55">
            <!-- Palace Courtyard Colonnades & Sunlight -->
            <rect x="40" y="100" width="75" height="550" rx="8" fill="#BCAAA4" />
            <rect x="180" y="100" width="75" height="550" rx="8" fill="#BCAAA4" />
            <path d="M40,160 Q145,70 255,160" fill="none" stroke="#A1887F" stroke-width="28" />
            <!-- Teak Garden Bench -->
            <rect x="200" y="580" width="400" height="25" rx="5" fill="#5D4037" />
            <rect x="220" y="520" width="360" height="15" rx="3" fill="#8D6E63" />
            <rect x="220" y="545" width="360" height="15" rx="3" fill="#8D6E63" />
        </g>
        

  <!-- Lush Garden Foliage & White Jasmine Shrubs -->
  <g opacity="0.8">
    <path d="M0,720 Q160,540 230,760 Q120,930 0,1000 Z" fill="#1B4332" />
    <path d="M800,690 Q640,510 560,740 Q710,930 800,1000 Z" fill="#2D6A4F" />
    <!-- White Jasmine Flowers Scattered -->
    <g fill="#FFFFFF">
      <circle cx="80" cy="620" r="7" />
      <circle cx="110" cy="580" r="8" />
      <circle cx="140" cy="650" r="6" />
      <circle cx="680" cy="610" r="8" />
      <circle cx="640" cy="570" r="7" />
      <circle cx="730" cy="660" r="8" />
      <circle cx="600" cy="640" r="6" />
    </g>
  </g>

  <!-- Central Model in Royal Magenta Silk Saree -->
  <g id="model_2">
    <!-- Silk Saree Pleats & Flared Draping -->
    <path d="M300,470 Q240,700 230,940 L570,940 Q540,700 480,470 Z" fill="url(#sareePink_2)" filter="drop-shadow(0px 18px 30px rgba(0,0,0,0.65))" />
    
    <!-- Heavy Gold Zari Pallu with Diamond Weave -->
    <path d="M385,450 L485,460 L540,940 L445,940 Z" fill="url(#goldZari_2)" />
    <path d="M385,450 L485,460 L540,940 L445,940 Z" fill="url(#zariPattern_2)" />

    <!-- Broad Golden Zari Bottom Border -->
    <rect x="230" y="885" width="340" height="55" fill="url(#goldZari_2)" />
    <rect x="230" y="885" width="340" height="55" fill="url(#zariPattern_2)" />

    <!-- Silk Blouse -->
    <path d="M320,335 L470,335 L480,480 L310,480 Z" fill="url(#sareePink_2)" />
    <!-- Blouse Gold Sleeve Borders -->
    <rect x="300" y="375" width="28" height="65" rx="6" fill="url(#goldZari_2)" />
    <rect x="460" y="375" width="28" height="65" rx="6" fill="url(#goldZari_2)" />

    <!-- 22K Gold Choker Necklace -->
    <path d="M360,335 Q395,370 430,335" fill="none" stroke="url(#goldZari_2)" stroke-width="12" stroke-linecap="round" filter="url(#goldGlow_2)" />

    <!-- Model Portrait / Graceful Facial Features -->
    <ellipse cx="395" cy="245" rx="55" ry="68" fill="#E8B590" />
    <!-- Radiant Hair with White Jasmine Veni / Gajra -->
    <path d="M330,245 C330,160 460,160 460,245 C460,320 440,350 425,360 C380,310 350,320 330,245 Z" fill="#1C120C" />
    <!-- Jasmine Flowers Woven into Hair -->
    <path d="M340,215 Q365,175 425,185" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-dasharray="7 4" filter="drop-shadow(0px 2px 5px rgba(0,0,0,0.6))" />

    <!-- Specific Visual Pose Elements -->
    
    <!-- Seated Posture with Garland in Hands -->
    <g transform="translate(330, 440)">
      <path d="M10,20 Q65,70 120,20" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-dasharray="8 4" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.5))" />
      <circle cx="65" cy="78" r="14" fill="#FFFFFF" />
      <circle cx="65" cy="78" r="8" fill="#FFF9C4" />
    </g>
    
  </g>

  <!-- Ornate Vintage Golden Frame -->
  <rect x="16" y="16" width="768" height="968" rx="4" fill="none" stroke="url(#goldZari_2)" stroke-width="3.5" />
  <rect x="24" y="24" width="752" height="952" rx="2" fill="none" stroke="url(#goldZari_2)" stroke-width="1.2" stroke-opacity="0.75" />

  <!-- Corner Filigree Flourishes -->
  <g stroke="url(#goldZari_2)" stroke-width="2.2" fill="none">
    <path d="M24,75 Q50,50 75,24 M24,52 Q45,45 52,24 M36,36 L58,58" />
    <path d="M776,75 Q750,50 725,24 M776,52 Q755,45 748,24 M764,36 L742,58" />
    <path d="M24,925 Q50,950 75,976 M24,948 Q45,955 52,976 M36,964 L58,942" />
    <path d="M776,925 Q750,950 725,976 M776,948 Q755,955 748,976 M764,964 L742,942" />
  </g>

  <!-- Top Right Gold Numbered Medallion -->
  <g transform="translate(710, 68)">
    <circle cx="0" cy="0" r="38" fill="url(#goldZari_2)" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.65))" />
    <circle cx="0" cy="0" r="34" fill="none" stroke="#1A110B" stroke-width="1.8" />
    <text x="0" y="13" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="38" font-weight="bold" fill="#1A110B" text-anchor="middle">2</text>
  </g>

  <!-- Bottom Center Emblem 'Designed by - @rgcreation711' -->
  <g transform="translate(400, 942)">
    <path d="M-145,-26 L145,-26 L160,-5 L145,16 L-145,16 L-160,-5 Z" fill="#080A0F" stroke="url(#goldZari_2)" stroke-width="2" filter="drop-shadow(0px 6px 14px rgba(0,0,0,0.75))" />
    <circle cx="-168" cy="-5" r="3.5" fill="url(#goldZari_2)" />
    <circle cx="168" cy="-5" r="3.5" fill="url(#goldZari_2)" />
    <text x="0" y="-8" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="12.5" fill="#E8B590" text-anchor="middle" letter-spacing="1">Designed by -</text>
    <text x="0" y="9" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-size="13.5" font-weight="bold" fill="#FFF9C4" text-anchor="middle" letter-spacing="1.5">@rgcreation711</text>
  </g>
</svg>