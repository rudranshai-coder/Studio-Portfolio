<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="silkField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5E2B5"/>
      <stop offset="50%" stop-color="#B0D69A"/>
      <stop offset="100%" stop-color="#91C37B"/>
    </linearGradient>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#997300"/>
      <stop offset="100%" stop-color="#F3CA40"/>
    </linearGradient>
  </defs>

  <!-- Rich Raw Silk Backdrop -->
  <rect width="1080" height="1920" fill="url(#silkField)"/>
  
  <!-- Subtle Raw Silk Slub Texture lines -->
  <g stroke="#86B571" stroke-width="2" opacity="0.3">
    <line x1="0" y1="200" x2="1080" y2="200"/>
    <line x1="0" y1="450" x2="1080" y2="450"/>
    <line x1="0" y1="700" x2="1080" y2="700"/>
    <line x1="0" y1="950" x2="1080" y2="950"/>
    <line x1="0" y1="1200" x2="1080" y2="1200"/>
    <line x1="0" y1="1450" x2="1080" y2="1450"/>
    <line x1="0" y1="1700" x2="1080" y2="1700"/>
  </g>

  <!-- Grand Gold Zari Jacquard Side Border -->
  <rect x="0" y="0" width="260" height="1920" fill="url(#goldBorderGrad)"/>
  
  <!-- Intricate Zari Flowers & Vines Weave on Border -->
  <g fill="none" stroke="#7A5600" stroke-width="4">
    <!-- Top & bottom guide lines -->
    <line x1="30" y1="0" x2="30" y2="1920"/>
    <line x1="230" y1="0" x2="230" y2="1920"/>
    
    <!-- Repeating Gold Lotus Flower Motifs in Border -->
    <g transform="translate(130, 200)">
      <circle cx="0" cy="0" r="45" fill="#D4AF37" stroke="#8C6510" stroke-width="4"/>
      <circle cx="0" cy="0" r="18" fill="#FFF275"/>
      <path d="M 0 -45 Q 25 0 0 45 Q -25 0 0 -45 Z" fill="#E8C340"/>
      <path d="M -45 0 Q 0 25 45 0 Q 0 -25 -45 0 Z" fill="#E8C340"/>
    </g>
    <g transform="translate(130, 500)">
      <circle cx="0" cy="0" r="45" fill="#D4AF37" stroke="#8C6510" stroke-width="4"/>
      <circle cx="0" cy="0" r="18" fill="#FFF275"/>
      <path d="M 0 -45 Q 25 0 0 45 Q -25 0 0 -45 Z" fill="#E8C340"/>
      <path d="M -45 0 Q 0 25 45 0 Q 0 -25 -45 0 Z" fill="#E8C340"/>
    </g>
    <g transform="translate(130, 800)">
      <circle cx="0" cy="0" r="45" fill="#D4AF37" stroke="#8C6510" stroke-width="4"/>
      <circle cx="0" cy="0" r="18" fill="#FFF275"/>
      <path d="M 0 -45 Q 25 0 0 45 Q -25 0 0 -45 Z" fill="#E8C340"/>
      <path d="M -45 0 Q 0 25 45 0 Q 0 -25 -45 0 Z" fill="#E8C340"/>
    </g>
    <g transform="translate(130, 1100)">
      <circle cx="0" cy="0" r="45" fill="#D4AF37" stroke="#8C6510" stroke-width="4"/>
      <circle cx="0" cy="0" r="18" fill="#FFF275"/>
      <path d="M 0 -45 Q 25 0 0 45 Q -25 0 0 -45 Z" fill="#E8C340"/>
      <path d="M -45 0 Q 0 25 45 0 Q 0 -25 -45 0 Z" fill="#E8C340"/>
    </g>
    <g transform="translate(130, 1400)">
      <circle cx="0" cy="0" r="45" fill="#D4AF37" stroke="#8C6510" stroke-width="4"/>
      <circle cx="0" cy="0" r="18" fill="#FFF275"/>
      <path d="M 0 -45 Q 25 0 0 45 Q -25 0 0 -45 Z" fill="#E8C340"/>
      <path d="M -45 0 Q 0 25 45 0 Q 0 -25 -45 0 Z" fill="#E8C340"/>
    </g>
  </g>

  <!-- Center Artwork: Handcrafted Tree of Life Embroidery -->
  <g transform="translate(280, 200)">
    <!-- Tree of Life Trunk -->
    <path d="M 450 1400 Q 430 1000 400 700 Q 360 450 300 300" stroke="#375328" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M 400 700 Q 480 550 550 420" stroke="#375328" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 420 850 Q 520 750 600 680" stroke="#375328" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 380 550 Q 280 460 220 380" stroke="#375328" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 450 1100 Q 350 950 260 850" stroke="#375328" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- Lush Green Leaves & Threadwork -->
    <g fill="#6EA656" stroke="#487A33" stroke-width="2">
      <ellipse cx="300" cy="300" rx="35" ry="18" transform="rotate(-30 300 300)"/>
      <ellipse cx="340" cy="260" rx="30" ry="15" transform="rotate(20 340 260)"/>
      <ellipse cx="550" cy="420" rx="35" ry="18" transform="rotate(40 550 420)"/>
      <ellipse cx="600" cy="680" rx="35" ry="18" transform="rotate(15 600 680)"/>
      <ellipse cx="220" cy="380" rx="35" ry="18" transform="rotate(-45 220 380)"/>
      <ellipse cx="260" cy="850" rx="40" ry="20" transform="rotate(-35 260 850)"/>
    </g>

    <!-- Blossoming Lotus Pond with Large Lilies and Leaves -->
    <!-- Large Lotus Pond Leaves -->
    <ellipse cx="250" cy="1200" rx="90" ry="32" fill="#588D44" stroke="#365C27" stroke-width="4"/>
    <path d="M 250 1200 L 290 1175" stroke="#365C27" stroke-width="4"/>
    
    <ellipse cx="520" cy="1250" rx="110" ry="38" fill="#588D44" stroke="#365C27" stroke-width="4"/>
    <path d="M 520 1250 L 570 1220" stroke="#365C27" stroke-width="4"/>

    <!-- Pink & Coral Silk Lotus Blossoms -->
    <!-- Lotus 1 -->
    <g transform="translate(260, 1120)">
      <path d="M 0 0 C -40 -60 40 -60 0 0 Z" fill="#E86C78"/>
      <path d="M -20 -15 C -60 -50 -10 -70 -20 -15 Z" fill="#FAA0A8"/>
      <path d="M 20 -15 C 60 -50 10 -70 20 -15 Z" fill="#FAA0A8"/>
      <path d="M -35 -10 C -80 -35 -40 -60 -35 -10 Z" fill="#F8B4BA"/>
      <path d="M 35 -10 C 80 -35 40 -60 35 -10 Z" fill="#F8B4BA"/>
      <circle cx="0" cy="-20" r="10" fill="#FFDF73"/>
    </g>

    <!-- Lotus 2 (Full Bloom) -->
    <g transform="translate(540, 1150) scale(1.3)">
      <path d="M 0 0 C -40 -60 40 -60 0 0 Z" fill="#E86C78"/>
      <path d="M -20 -15 C -60 -50 -10 -70 -20 -15 Z" fill="#FAA0A8"/>
      <path d="M 20 -15 C 60 -50 10 -70 20 -15 Z" fill="#FAA0A8"/>
      <path d="M -35 -10 C -80 -35 -40 -60 -35 -10 Z" fill="#F8B4BA"/>
      <path d="M 35 -10 C 80 -35 40 -60 35 -10 Z" fill="#F8B4BA"/>
      <circle cx="0" cy="-20" r="12" fill="#FFDF73"/>
    </g>
  </g>

  <!-- Rich Gold Zari Bottom Hem with Latkan Tassels -->
  <rect x="0" y="1680" width="1080" height="100" fill="url(#goldBorderGrad)"/>
  <g stroke="#64994E" stroke-width="6" fill="#88C46E">
    <line x1="100" y1="1780" x2="100" y2="1870"/><circle cx="100" cy="1880" r="12"/>
    <line x1="220" y1="1780" x2="220" y2="1870"/><circle cx="220" cy="1880" r="12"/>
    <line x1="340" y1="1780" x2="340" y2="1870"/><circle cx="340" cy="1880" r="12"/>
    <line x1="460" y1="1780" x2="460" y2="1870"/><circle cx="460" cy="1880" r="12"/>
    <line x1="580" y1="1780" x2="580" y2="1870"/><circle cx="580" cy="1880" r="12"/>
    <line x1="700" y1="1780" x2="700" y2="1870"/><circle cx="700" cy="1880" r="12"/>
    <line x1="820" y1="1780" x2="820" y2="1870"/><circle cx="820" cy="1880" r="12"/>
    <line x1="940" y1="1780" x2="940" y2="1870"/><circle cx="940" cy="1880" r="12"/>
  </g>

  <!-- High-Fashion Branding Badge -->
  <g transform="translate(60, 80)">
    <rect width="330" height="44" rx="22" fill="rgba(8,10,16,0.85)" stroke="rgba(255,255,255,0.15)"/>
    <circle cx="24" cy="22" r="6" fill="#00FF87"/>
    <text x="42" y="27" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">ACT 03 • TREE OF LIFE PALLU</text>
  </g>

  <!-- Editorial Details -->
  <g transform="translate(60, 1600)">
    <text font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="2">LOTUS POND &amp; TREE OF LIFE</text>
    <text y="35" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="500" fill="#FFE680" letter-spacing="1.5">SILK THREAD RESHAM EMBROIDERY • @rgcreation711</text>
  </g>
</svg>